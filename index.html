    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        // Allow real Vite HMR when running on a local dev server (localhost preview).
        // The AI Studio iframe workaround below only applies on hosted domains.
        var isLocalPreview = typeof location !== 'undefined' &&
          (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '[::1]');
        if (isLocalPreview) return;

        // Neutralize Vite HMR WebSocket errors in AI Studio iframe environment
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            const isVite = (typeof protocols === 'string' && protocols.includes('vite')) ||
              (Array.isArray(protocols) && protocols.some(p => typeof p === 'string' && p.includes('vite'))) ||
              (typeof url === 'string' && (url.includes('vite') || url.includes('@vite')));
            
            if (isVite) {
              const listeners = { open: [], close: [], error: [], message: [] };
              const mockWs = {
                url: url,
                protocol: Array.isArray(protocols) ? protocols[0] : (protocols || ''),
                readyState: 1, // OPEN
                send: function() {},
                close: function() {},
                addEventListener: function(event, handler) {
                  if (listeners[event]) listeners[event].push(handler);
                  if (event === 'open') {
                    setTimeout(function() { handler({ type: 'open' }); }, 0);
                  }
                },
                removeEventListener: function(event, handler) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(h => h !== handler);
                  }
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              setTimeout(function() {
                if (typeof mockWs.onopen === 'function') mockWs.onopen({ type: 'open' });
              }, 0);
              return mockWs;
            }
            return new NativeWebSocket(url, protocols);
          }
          ViteSafeWebSocket.prototype = NativeWebSocket.prototype;
          ViteSafeWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          ViteSafeWebSocket.OPEN = NativeWebSocket.OPEN;
          ViteSafeWebSocket.CLOSING = NativeWebSocket.CLOSING;
          ViteSafeWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = ViteSafeWebSocket;
        }

        // Suppress any stray console error referencing Vite WebSocket closure
        const origConsoleError = console.error;
        console.error = function() {
          for (let i = 0; i < arguments.length; i++) {
            const arg = arguments[i];
            if (typeof arg === 'string' && (arg.includes('WebSocket') || arg.includes('[vite]')) && arg.includes('closed without opened')) {
              return;
            }
            if (arg && arg.message && typeof arg.message === 'string' && arg.message.includes('WebSocket closed without opened')) {
              return;
            }
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body class="bg-[#f5f7f6] text-gray-900 antialiased selection:bg-[#0f4c3a]/15 selection:text-[#0f4c3a] min-h-screen">

  </body>
