<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#fff}svg{display:block}</style>
</head><body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg"
     font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif">
  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- LEFT: the tree -->
  <rect x="50" y="40" width="726" height="920" rx="26" fill="#fbfdfc" stroke="#d7e3dd" stroke-width="2"/>
  <text x="82" y="84" font-size="14" font-weight="800" fill="#0f4c3a" letter-spacing="1.6">FIRESTORE  →  DATA</text>
  <text x="82" y="120" font-size="20" font-weight="700" fill="#0d1b16" font-family="'JetBrains Mono',Consolas,monospace">alu-expense-tracker / default</text>

  <!-- users collection -->
  <rect x="82" y="150" width="662" height="60" rx="12" fill="#ffffff" stroke="#d7e3dd"/>
  <rect x="102" y="168" width="24" height="24" rx="6" fill="#0f4c3a"/>
  <text x="146" y="186" font-size="19" font-weight="700" fill="#0d1b16" font-family="'JetBrains Mono',Consolas,monospace">users</text>
  <text x="228" y="186" font-size="14" fill="#8a968f">collection</text>
  <text x="690" y="186" text-anchor="end" font-size="14" fill="#5f6b66">one folder for all students</text>

  <!-- account doc -->
  <rect x="122" y="222" width="622" height="60" rx="12" fill="#ffffff" stroke="#d7e3dd"/>
  <rect x="142" y="240" width="20" height="24" rx="4" fill="#9fc4b5"/>
  <text x="184" y="258" font-size="18" font-weight="700" fill="#0d1b16" font-family="'JetBrains Mono',Consolas,monospace">pC2DIC…</text>
  <text x="300" y="258" font-size="14" fill="#8a968f">document</text>
  <text x="652" y="258" text-anchor="end" font-size="14" fill="#5f6b66">= one student's account id (UID)</text>

  <!-- data -->
  <rect x="162" y="294" width="582" height="60" rx="12" fill="#ffffff" stroke="#d7e3dd"/>
  <rect x="182" y="312" width="24" height="24" rx="6" fill="#0f4c3a"/>
  <text x="226" y="330" font-size="19" font-weight="700" fill="#0d1b16" font-family="'JetBrains Mono',Consolas,monospace">data</text>
  <text x="292" y="330" font-size="14" fill="#8a968f">subcollection</text>

  <!-- store -->
  <rect x="202" y="366" width="542" height="66" rx="12" fill="#e8f5f0" stroke="#0f4c3a" stroke-width="2"/>
  <rect x="222" y="386" width="20" height="24" rx="4" fill="#0f4c3a"/>
  <text x="264" y="405" font-size="20" font-weight="800" fill="#0f4c3a" font-family="'JetBrains Mono',Consolas,monospace">store</text>
  <text x="336" y="405" font-size="14" fill="#4b6a5f">document</text>
  <text x="720" y="405" text-anchor="end" font-size="14" font-weight="700" fill="#0f4c3a">everything lives here</text>

  <!-- feedback -->
  <rect x="82" y="500" width="662" height="60" rx="12" fill="#ffffff" stroke="#d7e3dd"/>
  <rect x="102" y="518" width="24" height="24" rx="6" fill="#b45309" opacity="0.75"/>
  <text x="146" y="536" font-size="19" font-weight="700" fill="#0d1b16" font-family="'JetBrains Mono',Consolas,monospace">feedback</text>
  <text x="266" y="536" font-size="14" fill="#8a968f">collection</text>
  <text x="690" y="536" text-anchor="end" font-size="14" fill="#5f6b66">bug reports from students</text>

  <rect x="122" y="572" width="622" height="60" rx="12" fill="#ffffff" stroke="#d7e3dd"/>
  <rect x="142" y="590" width="20" height="24" rx="4" fill="#e0c9a0"/>
  <text x="184" y="608" font-size="18" font-weight="700" fill="#0d1b16" font-family="'JetBrains Mono',Consolas,monospace">random id</text>
  <text x="316" y="608" font-size="14" fill="#8a968f">document</text>
  <text x="652" y="608" text-anchor="end" font-size="14" fill="#5f6b66">message, email, version, page</text>

  <!-- notes -->
  <line x1="82" y1="676" x2="744" y2="676" stroke="#e2ebe6"/>
  <text x="82" y="712" font-size="15" font-weight="700" fill="#0d1b16">What you're looking at</text>
  <text x="82" y="738" font-size="15" fill="#5f6b66">Click a folder name to open it. The right-hand pane shows</text>
  <text x="82" y="760" font-size="15" fill="#5f6b66">the document exactly as Firebase stores it.</text>

  <text x="82" y="804" font-size="15" font-weight="700" fill="#0d1b16">Right now</text>
  <text x="82" y="830" font-size="15" fill="#5f6b66">7 accounts exist, 3 with saved data, and 1 bug report</text>
  <text x="82" y="852" font-size="15" fill="#5f6b66">is waiting in feedback.</text>

  <text x="82" y="896" font-size="15" font-weight="700" fill="#0d1b16">Never edit by hand</text>
  <text x="82" y="922" font-size="15" fill="#5f6b66">The app writes this document; a typo here can break</text>
  <text x="82" y="944" font-size="15" fill="#5f6b66">that student's screen. Use the app's own Settings.</text>

  <line x1="748" y1="400" x2="806" y2="400" stroke="#0f4c3a" stroke-width="2.5"/>
  <path d="M 806 400 l -12 -6 v 12 z" fill="#0f4c3a"/>

  <!-- RIGHT: inside store -->
  <rect x="816" y="40" width="734" height="920" rx="26" fill="#ffffff" stroke="#0f4c3a" stroke-width="3"/>
  <text x="848" y="88" font-size="14" font-weight="800" fill="#0f4c3a" letter-spacing="1.6">INSIDE  data → store</text>
  <text x="848" y="122" font-size="21" font-weight="700" fill="#0d1b16">Everything one student owns, in one document</text>

  <!-- profile -->
  <rect x="844" y="148" width="678" height="112" rx="14" fill="#f9fbfa" stroke="#e2ebe6"/>
  <text x="868" y="182" font-size="19" font-weight="800" fill="#0f4c3a" font-family="'JetBrains Mono',Consolas,monospace">profile</text>
  <rect x="964" y="162" width="52" height="22" rx="11" fill="#e8f5f0"/>
  <text x="990" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#0f4c3a">map</text>
  <text x="868" y="212" font-size="15" fill="#5f6b66">name · email · studentId · university · campus · currency</text>
  <text x="868" y="238" font-size="15" fill="#8a968f">avatarUrl: the profile photo, stored as shrunk text (≈15–40 KB)</text>

  <!-- budget -->
  <rect x="844" y="272" width="678" height="100" rx="14" fill="#f9fbfa" stroke="#e2ebe6"/>
  <text x="868" y="306" font-size="19" font-weight="800" fill="#0f4c3a" font-family="'JetBrains Mono',Consolas,monospace">budget</text>
  <rect x="952" y="286" width="52" height="22" rx="11" fill="#e8f5f0"/>
  <text x="978" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#0f4c3a">map</text>
  <text x="868" y="336" font-size="15" fill="#5f6b66">monthlyCap · cycleStartDay · notifyThresholdPct</text>
  <text x="868" y="358" font-size="15" fill="#8a968f">the cap, the day the month starts, when to warn</text>

  <!-- transactions -->
  <rect x="844" y="384" width="678" height="160" rx="14" fill="#f9fbfa" stroke="#e2ebe6"/>
  <text x="868" y="418" font-size="19" font-weight="800" fill="#0f4c3a" font-family="'JetBrains Mono',Consolas,monospace">transactions</text>
  <rect x="1032" y="398" width="62" height="22" rx="11" fill="#e8f5f0"/>
  <text x="1063" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#0f4c3a">array</text>
  <text x="868" y="448" font-size="15" fill="#5f6b66">One object per expense record:</text>
  <text x="868" y="474" font-size="14" fill="#5f6b66" font-family="'JetBrains Mono',Consolas,monospace">id · amount · category · date · time · note</text>
  <text x="868" y="496" font-size="14" fill="#5f6b66" font-family="'JetBrains Mono',Consolas,monospace">recipient · source · momoRef · createdAt · updatedAt</text>
  <text x="868" y="524" font-size="15" fill="#8a968f">Records are added one by one, never rewritten as a whole list.</text>

  <!-- categories -->
  <rect x="844" y="556" width="678" height="100" rx="14" fill="#f9fbfa" stroke="#e2ebe6"/>
  <text x="868" y="590" font-size="19" font-weight="800" fill="#0f4c3a" font-family="'JetBrains Mono',Consolas,monospace">categories</text>
  <rect x="1002" y="570" width="62" height="22" rx="11" fill="#e8f5f0"/>
  <text x="1033" y="586" text-anchor="middle" font-size="12" font-weight="700" fill="#0f4c3a">array</text>
  <text x="868" y="620" font-size="15" fill="#5f6b66">The 8 student categories with their colours and keywords</text>
  <text x="868" y="642" font-size="15" fill="#8a968f">Used for the auto-match when a note is typed.</text>

  <!-- tombstones -->
  <rect x="844" y="668" width="678" height="100" rx="14" fill="#fffaf0" stroke="#ecd9b0"/>
  <text x="868" y="702" font-size="18" font-weight="800" fill="#b45309" font-family="'JetBrains Mono',Consolas,monospace">deletedTransactionIds</text>
  <rect x="1108" y="682" width="62" height="22" rx="11" fill="#fdecc8"/>
  <text x="1139" y="698" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">array</text>
  <text x="868" y="732" font-size="15" fill="#5f6b66">Ids of records deleted on any device.</text>
  <text x="868" y="754" font-size="15" fill="#8a968f">Every device hides these, so a deleted record never returns.</text>

  <text x="848" y="814" font-size="15" font-weight="700" fill="#0d1b16">Why one document?</text>
  <text x="848" y="840" font-size="15" fill="#5f6b66">It loads an account in one read, works offline, and keeps</text>
  <text x="848" y="862" font-size="15" fill="#5f6b66">the free plan comfortable. The trade-off is the 1 MB limit,</text>
  <text x="848" y="884" font-size="15" fill="#5f6b66">which is why photos are shrunk before they are saved.</text>
</svg>
</body></html>
