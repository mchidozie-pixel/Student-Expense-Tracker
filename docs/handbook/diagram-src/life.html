<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#fff}svg{display:block}</style>
</head><body>
<svg width="1400" height="880" viewBox="0 0 1400 880" xmlns="http://www.w3.org/2000/svg"
     font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f4c3a"/>
    </marker>
  </defs>
  <rect width="1400" height="880" fill="#ffffff"/>

  <text x="40" y="34" font-size="15" font-weight="800" fill="#0f4c3a" letter-spacing="1.6">ONE EXPENSE, FROM TAP TO EVERY DEVICE</text>

  <!-- stage 1 -->
  <rect x="40" y="54" width="240" height="232" rx="16" fill="#ffffff" stroke="#d7e3dd"/>
  <circle cx="74" cy="88" r="14" fill="#e8f5f0"/>
  <text x="74" y="94" text-anchor="middle" font-size="14" font-weight="800" fill="#0f4c3a">1</text>
  <text x="62" y="132" font-size="25" font-weight="800" fill="#0d1b16">Tap Record</text>
  <text x="62" y="164" font-size="21" fill="#5f6b66">amount, note and</text>
  <text x="62" y="190" font-size="21" fill="#5f6b66">category, in one</text>
  <text x="62" y="216" font-size="21" fill="#5f6b66">small form</text>
  <text x="62" y="252" font-size="19" fill="#8a968f">works offline too</text>

  <!-- stage 2 -->
  <rect x="310" y="54" width="240" height="232" rx="16" fill="#ffffff" stroke="#d7e3dd"/>
  <circle cx="344" cy="88" r="14" fill="#e8f5f0"/>
  <text x="344" y="94" text-anchor="middle" font-size="14" font-weight="800" fill="#0f4c3a">2</text>
  <text x="332" y="132" font-size="25" font-weight="800" fill="#0d1b16">Saved on the</text>
  <text x="332" y="160" font-size="25" font-weight="800" fill="#0d1b16">phone</text>
  <text x="332" y="192" font-size="21" fill="#5f6b66">kept in the app's</text>
  <text x="332" y="218" font-size="21" fill="#5f6b66">own memory, so</text>
  <text x="332" y="244" font-size="21" fill="#5f6b66">the list never</text>
  <text x="332" y="270" font-size="21" fill="#5f6b66">looks empty</text>

  <!-- stage 3 -->
  <rect x="580" y="54" width="240" height="232" rx="16" fill="#e8f5f0" stroke="#0f4c3a" stroke-width="2"/>
  <circle cx="614" cy="88" r="14" fill="#0f4c3a"/>
  <text x="614" y="94" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
  <text x="602" y="132" font-size="25" font-weight="800" fill="#0f4c3a">Sent to the</text>
  <text x="602" y="160" font-size="25" font-weight="800" fill="#0f4c3a">account</text>
  <text x="602" y="192" font-size="21" fill="#4b6a5f">one record is</text>
  <text x="602" y="218" font-size="21" fill="#4b6a5f">appended; nothing</text>
  <text x="602" y="244" font-size="21" fill="#4b6a5f">else is rewritten</text>
  <text x="602" y="272" font-size="17" fill="#0f4c3a" font-family="'JetBrains Mono',Consolas,monospace">arrayUnion</text>

  <!-- stage 4 -->
  <rect x="850" y="54" width="240" height="232" rx="16" fill="#ffffff" stroke="#d7e3dd"/>
  <circle cx="884" cy="88" r="14" fill="#e8f5f0"/>
  <text x="884" y="94" text-anchor="middle" font-size="14" font-weight="800" fill="#0f4c3a">4</text>
  <text x="872" y="132" font-size="25" font-weight="800" fill="#0d1b16">Confirmed</text>
  <text x="872" y="164" font-size="21" fill="#5f6b66">the app reads the</text>
  <text x="872" y="190" font-size="21" fill="#5f6b66">record back before</text>
  <text x="872" y="216" font-size="21" fill="#5f6b66">it says “Saved”</text>
  <text x="872" y="252" font-size="19" fill="#8a968f">honest, not hopeful</text>

  <!-- stage 5 -->
  <rect x="1120" y="54" width="240" height="232" rx="16" fill="#ffffff" stroke="#d7e3dd"/>
  <circle cx="1154" cy="88" r="14" fill="#e8f5f0"/>
  <text x="1154" y="94" text-anchor="middle" font-size="14" font-weight="800" fill="#0f4c3a">5</text>
  <text x="1142" y="132" font-size="25" font-weight="800" fill="#0d1b16">Every device</text>
  <text x="1142" y="160" font-size="25" font-weight="800" fill="#0d1b16">updates</text>
  <text x="1142" y="192" font-size="21" fill="#5f6b66">a live listener</text>
  <text x="1142" y="218" font-size="21" fill="#5f6b66">pushes the change</text>
  <text x="1142" y="244" font-size="21" fill="#5f6b66">to phone and PC</text>
  <text x="1142" y="270" font-size="19" fill="#8a968f">no refresh needed</text>

  <!-- arrows -->
  <line x1="284" y1="170" x2="302" y2="170" stroke="#0f4c3a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="554" y1="170" x2="572" y2="170" stroke="#0f4c3a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="824" y1="170" x2="842" y2="170" stroke="#0f4c3a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1094" y1="170" x2="1112" y2="170" stroke="#0f4c3a" stroke-width="2.5" marker-end="url(#a)"/>

  <line x1="40" y1="322" x2="1360" y2="322" stroke="#e2ebe6" stroke-width="2"/>
  <text x="40" y="360" font-size="17" font-weight="800" fill="#0d1b16">THE THREE OTHER THINGS THAT CAN HAPPEN</text>

  <!-- offline -->
  <rect x="40" y="378" width="420" height="212" rx="16" fill="#fbfdfc" stroke="#d7e3dd"/>
  <text x="66" y="416" font-size="24" font-weight="800" fill="#0d1b16">No connection?</text>
  <text x="66" y="450" font-size="21" fill="#5f6b66">the record waits in a queue</text>
  <text x="66" y="476" font-size="21" fill="#5f6b66">on the phone and is sent</text>
  <text x="66" y="502" font-size="21" fill="#5f6b66">by itself when the signal</text>
  <text x="66" y="528" font-size="21" fill="#5f6b66">returns — nothing is lost</text>
  <text x="66" y="564" font-size="18" fill="#8a968f">added in 1.9.1</text>

  <!-- edit -->
  <rect x="490" y="378" width="420" height="212" rx="16" fill="#fbfdfc" stroke="#d7e3dd"/>
  <text x="516" y="416" font-size="24" font-weight="800" fill="#0d1b16">Edited?</text>
  <text x="516" y="450" font-size="21" fill="#5f6b66">the old copy is removed,</text>
  <text x="516" y="476" font-size="21" fill="#5f6b66">the new one added; the</text>
  <text x="516" y="502" font-size="21" fill="#5f6b66">later timestamp wins, so</text>
  <text x="516" y="528" font-size="21" fill="#5f6b66">a slow phone can't undo it</text>

  <!-- delete -->
  <rect x="940" y="378" width="420" height="212" rx="16" fill="#fffaf0" stroke="#ecd9b0"/>
  <text x="966" y="416" font-size="24" font-weight="800" fill="#0d1b16">Deleted?</text>
  <text x="966" y="450" font-size="21" fill="#5f6b66">its id is written into</text>
  <text x="966" y="476" font-size="21" fill="#5f6b66">deletedTransactionIds,</text>
  <text x="966" y="502" font-size="21" fill="#5f6b66">so no device can bring</text>
  <text x="966" y="528" font-size="21" fill="#5f6b66">the record back</text>
  <text x="966" y="564" font-size="18" fill="#b45309">the “it removed itself” fix, 1.9</text>

  <line x1="40" y1="626" x2="1360" y2="626" stroke="#e2ebe6" stroke-width="2"/>
  <text x="40" y="664" font-size="17" font-weight="800" fill="#0d1b16">WHY IT IS BUILT THIS WAY</text>
  <text x="40" y="698" font-size="21" fill="#3d4b45">•  Before 1.9, saving one record rewrote the whole list from that device's memory — an older copy could erase a newer record.</text>
  <text x="40" y="728" font-size="21" fill="#3d4b45">•  Now a save only appends; a second phone merges both copies instead of replacing one.</text>
  <text x="40" y="758" font-size="21" fill="#3d4b45">•  Profile, budget and photo saves are told to leave the record list out — the source of the “numbers changed” confusion.</text>
  <text x="40" y="788" font-size="21" fill="#3d4b45">•  “Saved” means the account confirmed it; offline means “saved here, will sync” — never a hopeful lie.</text>

  <text x="40" y="840" font-size="16" fill="#8a968f" font-family="'JetBrains Mono',Consolas,monospace">arrayUnion · arrayRemove · deletedTransactionIds · includeTransactions: false · alu_pending_tx_v1</text>
</svg>
</body></html>
