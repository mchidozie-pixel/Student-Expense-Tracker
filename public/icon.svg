<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145a46"/>
      <stop offset="100%" stop-color="#0a3528"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#pineGrad)"/>
  
  <!-- Subtle inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Center emblem group with drop shadow -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Shield / Diamond polygon -->
    <path d="M 0 -130 L 120 -40 L 120 70 L 0 140 L -120 70 L -120 -40 Z" fill="rgba(255,255,255,0.08)" stroke="#34d399" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Central Coin / ALU Student Ledger Glyph -->
    <circle r="72" fill="url(#goldGrad)"/>
    <circle r="60" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,4" stroke-opacity="0.8"/>
    
    <!-- Bold Ledger currency symbol (Frw / currency crest) -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="70" font-weight="900" fill="#ffffff" text-anchor="middle">R₣</text>
    
    <!-- Small star / sparkle on top right -->
    <path d="M 95 -95 Q 115 -95 115 -115 Q 115 -95 135 -95 Q 115 -95 115 -75 Q 115 -95 95 -95 Z" fill="#34d399"/>
  </g>
</svg>
